<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicky's Gaming Den</title>
    <link rel="icon" type="image/png" href="images/IMG_0045 2.png">
    <style>
        /* This targets the whole page */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e; /* Dark blue/black background */
            color: #e9e9e9;           /* Light text color */
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        /* Styling the header */
        header {
            text-align: center;
            color: #00d2ff; /* Neon blue */
        }

        /* Making links look like buttons */
        a {
            color: #ff007c; /* Hot pink */
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-shadow: 0 0 10px #ff007c;
        }

        /* Adding a container for the content */
        main {
            max-width: 600px;
            margin: auto;
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 20px;
            opacity: 0.7;
        }
        /* Layout for the header to keep title and nav tidy */
        header {
            text-align: center;
            padding-bottom: 20px;
        }

        .top-nav {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px; /* Puts space between the buttons */
        }

        /* Styling the buttons */
        .nav-btn {
            padding: 8px 16px;
            background-color: #333; /* Dark grey */
            color: white !important;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9rem;
            transition: 0.3s;
            border: 1px solid #444;
        }

        /* Specific style for the Forum button to make it pop */
        .forum-style {
            background-color: #00d2ff; /* Bright blue */
            border-color: #00a8cc;
        }

        .nav-btn:hover {
            background-color: #ff007c; /* Pink hover effect */
            transform: translateY(-2px); /* Slight lift effect */
        }

    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>Welcome to my site!</h1>
            <p>umm site ig</p>
        </div>
            <nav class="top-nav">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="https://nicn1202.boards.net" target="_blank" class="nav-btn forum-style">Forum</a>
        </nav>
    </header>


    <main>
        <section>
            <h2>About me</h2>
            <p>I'm a 14-year-old gamer! I also like learning about coding and building stuff for the web.</p>
        </section>

        <section>
            <h2>Links</h2>
            <ul>
                <li><a href="https://www.google.com" target="_blank">Google</a></li>
                <li><a href="https://www.wikipedia.org" target="_blank">Wikipedia</a></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Created by Nicky</p>
    </footer>

</body>
</html>
