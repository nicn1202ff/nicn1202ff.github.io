<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicky's Gaming Den</title>
    <style>
        /* This targets the whole page */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e; /* Dark blue/black background */
            color: #e9e9e9;           /* Light text color */
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        /* Styling the header */
        header {
            text-align: center;
            color: #00d2ff; /* Neon blue */
        }

        /* Making links look like buttons */
        a {
            color: #ff007c; /* Hot pink */
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-shadow: 0 0 10px #ff007c;
        }

        /* Adding a container for the content */
        main {
            max-width: 600px;
            margin: auto;
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 20px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to my site!</h1>
        <p>A gamer's corner of the web.</p>
    </header>

    <main>
        <section>
            <h2>About me</h2>
            <p>I'm a 14-year-old gamer! I also like learning about coding and building stuff for the web.</p>
        </section>

        <section>
            <h2>Links</h2>
            <ul>
                <li><a href="https://www.google.com" target="_blank">Google</a></li>
                <li><a href="https://www.wikipedia.org" target="_blank">Wikipedia</a></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Created by Nicky</p>
    </footer>

</body>
</html>
