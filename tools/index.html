<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools | Nicky's Site</title>
    <link rel="icon" type="image/png" href="../images/IMG_0045 2.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e9e9e9;
            padding: 20px;
            text-align: center;
        }
        main {
            max-width: 700px;
            margin: auto;
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #00d2ff;
        }
        .nav-btn {
            padding: 10px 20px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
            display: inline-block;
        }
        .nav-btn:hover { background: #ff007c; }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0f172a;
            color: #00ff00;
            border: 1px solid #444;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: monospace;
        }
        .generate-btn {
            background: #00d2ff;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #resultArea {
            margin-top: 20px;
            padding: 20px;
            border-top: 1px solid #444;
            display: none;
        }
        .bookmark-btn {
            background: #ff007c;
            padding: 15px 25px;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: move;
            display: inline-block;
        }
    </style>
</head>
<body>

    <nav>
        <a href="../index.html" class="nav-btn">← Back Home</a>
    </nav>

    <main>
        <h1>Bookmarklet Maker V2</h1>
        <p>Custom names & Direct JS Conversion</p>

        <label>1. Bookmarklet Name:</label>
        <input type="text" id="bmName" placeholder="e.g., My Tool">

        <label>2. JavaScript Code:</label>
        <textarea id="bmCode" rows="8" placeholder="alert('Hello!');"></textarea>

        <button onclick="generateV2()" class="generate-btn">Create Bookmarklet</button>

        <div id="resultArea">
            <p><strong>Success!</strong> Drag the button below to your bookmarks bar:</p>
            <a href="#" id="finalLink" class="bookmark-btn">Bookmarklet</a>
        </div>
    </main>

    <script>
        function generateV2() {
            const name = document.getElementById('bmName').value || "Bookmarklet";
            const code = document.getElementById('bmCode').value;
            const res = document.getElementById('resultArea');
            const link = document.getElementById('finalLink');

            if(!code.trim()) return alert("Enter some code!");

            // V2 Logic: Wraps and encodes
            const cleanCode = "javascript:(function(){" + encodeURIComponent(code) + "})();";
            
            link.innerText = name;
            link.href = cleanCode;
            res.style.display = "block";
        }
    </script>
</body>
</html>
